<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Forex Data Downloader Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #333; margin: 0; padding: 0; }
    .container { max-width: 700px; margin: 60px auto; background: white; padding: 40px; border-radius: 15px;
                 box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #0052cc; }
    button { background: #0052cc; color: white; padding: 12px 25px; border: none; border-radius: 8px;
             cursor: pointer; font-size: 16px; margin: 10px; transition: 0.2s; }
    button:hover { background: #0066ff; }
    .log { margin-top: 20px; text-align: left; background: #f1f3f6; padding: 15px; border-radius: 10px;
           height: 200px; overflow-y: auto; font-family: monospace; font-size: 14px; }
    input, select, label { margin: 5px; }
    input, select { padding: 8px; width: 160px; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Forex Data Downloader</h1>
    <p>Ejecuta procesos del API con un clic.</p>

    <div>
      <input id="symbols" type="text" placeholder="Símbolos (EURUSD,GBPUSD)" value="EURUSD,GBPUSD" />
      <input id="start" type="text" placeholder="Inicio (YYYY-MM-DD)" value="2024-01-01" />
      <input id="end" type="text" placeholder="Fin (YYYY-MM-DD)" value="2024-01-03" />
    </div>

    <div>
      <label for="mode">Modo de descarga:</label>
      <select id="mode" onchange="toggleTimeframe()">
        <option value="ticks">Ticks (alta resolución)</option>
        <option value="ohlc">OHLC + Volumen</option>
      </select>
    </div>

    <div id="timeframeDiv" style="display:none;">
      <label for="timeframe">Timeframe:</label>
      <select id="timeframe">
        <option value="1m">1 minuto</option>
        <option value="5m">5 minutos</option>
        <option value="15m">15 minutos</option>
        <option value="1h">1 hora</option>
        <option value="4h">4 horas</option>
        <option value="1d">1 día</option>
      </select>
    </div>

    <button onclick="runAll()">▶ Ejecutar run_all</button>

    <div class="log" id="log">Esperando acción...</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      toggleTimeframe();
    });

    function toggleTimeframe() {
      const mode = document.getElementById('mode').value;
      const tfDiv = document.getElementById('timeframeDiv');
      tfDiv.style.display = mode === 'ohlc' ? 'block' : 'none';
    }

    async function runAll() {
      const symbols = document.getElementById('symbols').value;
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const mode = document.getElementById('mode').value;
      const timeframe = document.getElementById('timeframe').value;
      const log = document.getElementById('log');
      log.style.color = '#333';
      log.textContent = '⏳ Ejecutando proceso...';

      const payload = {
        symbols,
        start,
        end,
        mode,
        timeframe,
        clean_intermediate: true
      };

      try {
        const response = await fetch('/run_all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          log.style.color = '#b71c1c';
          log.textContent = `❌ Error del servidor:
${text}`;
          return;
        }

        if (!response.ok) {
          log.style.color = '#b71c1c';
          log.textContent = `⚠️ Código ${response.status} - ${data.error || 'Error desconocido'}

Detalle:
${JSON.stringify(data.detail, null, 2)}`;
          return;
        }

        log.style.color = '#1b5e20';
        log.textContent = `✅ Éxito:
${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        log.style.color = '#b71c1c';
        log.textContent = `🌐 Error de red o conexión:
${error}`;
      }
    }
  </script>
</body>
</html>
