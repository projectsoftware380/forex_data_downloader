[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-data-downloader"
version = "0.1.0"
description = "Data engineering pipeline for Dukascopy ticks, OHLC bars, quality validation, Parquet storage and FastAPI access"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Manuel Alfonso Rincón Méndez"}]

[project.scripts]
fxd = "forex_data.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
